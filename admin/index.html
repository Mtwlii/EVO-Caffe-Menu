<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080c15">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>لوحة التحكم — EVO Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../features/admin/admin.css">
</head>
<body>
<header class="adm-head">
  <div class="adm-brand"><svg class="adm-logo" viewBox="0 0 64 44" fill="none" aria-hidden="true"><path d="M17 3h30c6 0 9 3 12 14l3 16c1 6-2 10-7 10-4 0-6-2-9-6l-3-4H21l-3 4c-3 4-5 6-9 6-5 0-8-4-7-10l3-16C8 6 11 3 17 3z" fill="#121a2c" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M19 15v10M14 20h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="43" cy="14" r="2.4" fill="#4ade80"/><circle cx="49" cy="20" r="2.4" fill="#f87171"/><circle cx="43" cy="26" r="2.4" fill="#60a5fa"/><circle cx="37" cy="20" r="2.4" fill="#f472b6"/></svg><h1>لوحة تحكم EVO<small>ARCADE CONTROL</small></h1></div>
  <button id="logout" class="btn ghost" hidden>خروج</button>
</header>

<main id="app">
  <section id="loginView" class="card" hidden>
    <h2>دخول الأدمن</h2>
    <label>الإيميل <input id="email" type="email" autocomplete="username" dir="ltr"></label>
    <label>الباسورد <input id="password" type="password" autocomplete="current-password" dir="ltr"></label>
    <div id="loginErr" class="err" hidden></div>
    <button id="loginBtn" class="btn">دخول</button>
  </section>

  <section id="itemsView" hidden>
    <div class="tabs">
      <button id="tabMenu" class="on">المنيو</button>
      <button id="tabRooms">غرف البلايستيشن</button>
      <button id="tabOrders">الطلبات</button>
    </div>
    <div id="menuTab">
    <div class="toolbar">
      <input id="q" type="search" placeholder="ابحث عن صنف...">
      <span id="count" class="muted"></span>
    </div>
    <div id="groups"></div>
    </div>
    <div id="ordersTab" hidden>
      <p class="muted">آخر الطلبات من المنيو. اطبع إيصال للزبون من هنا.</p>
      <div id="orders"></div>
    </div>
    <div id="roomsTab" hidden>
      <p class="muted" id="roomsHint">ابدأ جلسة لما الزبون يدخل، واقفلها لما يخلص. الحساب بالدقيقة على سعر الساعة.</p>
      <div id="rooms"></div>
    </div>
  </section>

  <section id="configMsg" class="card" hidden>
    <h2>الإعداد ناقص</h2>
    <p>لم يتم ضبط بيانات الاتصال بقاعدة البيانات بعد (features/data/data.config.js).</p>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="../features/data/data.config.js"></script>
<script src="../features/admin/admin.js"></script>
</body>
</html>
